<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><meta name="description" content="30 day skincare routine planner"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css?v=5"><title>30 Day Skin Routine · V4</title></head><body><div id="app"><header class="topbar"><div class="brand"><div class="brand-mark">30</div><div><div class="eyebrow">SKIN ROUTINE</div><h1>My Routine</h1></div></div><button class="icon-btn" id="settingsBtn">⚙️</button></header><main id="screen"></main><nav class="bottom-nav"><button data-tab="today" class="nav-item active"><span>⌂</span><small>Today</small></button><button data-tab="days" class="nav-item"><span>30</span><small>Days</small></button><button data-tab="products" class="nav-item"><span>✦</span><small>Products</small></button><button data-tab="progress" class="nav-item"><span>◔</span><small>Progress</small></button></nav></div><div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2>Settings</h2><button class="icon-btn" id="closeModal">✕</button></div><label class="field">Plan start date<input type="date" id="startDate"></label><div class="time-grid"><label class="field">Morning<input type="time" id="morningTime"></label><label class="field">Night<input type="time" id="nightTime"></label></div><button class="secondary-btn" id="themeBtn">🌙 Dark mode: OFF</button><button class="primary-btn" id="notifyBtn">🔔 Enable notifications</button><button class="primary-btn" id="installBtn">📲 Install app</button><button class="secondary-btn danger-btn" id="resetBtn">Reset progress & photos</button><p class="note">Notifications work when permission is allowed. Reminder scheduling is active while the app is open/active; Android/browser background limits may prevent exact-time local reminders.</p></div></div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><script src="app-v5.js?v=5"></script></body></html>
