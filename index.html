<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec"><meta name="description" content="30 day skin routine planner">
<link rel="manifest" href="manifest.json?v=18"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css?v=18">
<title>30 Day Skin Routine</title>
</head>
<body>
<div id="app">
<header class="topbar"><div class="top-info" id="topInfo"><div class="top-day"><strong id="topDay">1</strong><small>/30</small></div><div class="top-date"><b id="topDate">—</b></div></div><div class="top-actions"><button class="icon-btn" id="themeQuick" aria-label="Toggle dark mode">☾</button><button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button></div></header>
<main id="screen"></main>
<nav class="bottom-nav"><button data-tab="today" class="nav-item active"><span>⌂</span><small>Today</small></button><button data-tab="days" class="nav-item"><span>30</span><small>Days</small></button><button data-tab="progress" class="nav-item"><span>◔</span><small>Progress</small></button></nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2>Settings</h2><button class="icon-btn" id="closeModal" aria-label="Close">×</button></div>
<label class="field">Plan start date<input type="date" id="startDate"></label><button class="secondary-btn" id="installBtn">📲 Install app</button><button class="secondary-btn danger-btn" id="resetBtn">Reset progress & photos</button><p class="note">Your routine progress and photos are saved on this phone.</p>
</div></div>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
<script src="app.js?v=18"></script>
</body></html>
