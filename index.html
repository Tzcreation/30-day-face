<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee"><meta name="description" content="30 day skin routine planner"><link rel="manifest" href="manifest.json?v=8"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css?v=9"><title>30 Day Skin Routine</title></head><body><div id="app"><header class="topbar"><div class="brand"><div class="brand-mark">30</div><div><div class="eyebrow">SKIN ROUTINE</div><h1>My Routine</h1></div></div><button class="icon-btn" id="settingsBtn">⚙️</button></header><main id="screen"></main><nav class="bottom-nav"><button data-tab="today" class="nav-item active"><span>⌂</span><small>Today</small></button><button data-tab="days" class="nav-item"><span>30</span><small>Days</small></button><button data-tab="progress" class="nav-item"><span>◔</span><small>Progress</small></button></nav></div><div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2>Settings</h2><button class="icon-btn" id="closeModal">✕</button></div><label class="field">Plan start date<input type="date" id="startDate"></label><div class="time-grid"><label class="field">Morning reminder<input type="time" id="morningTime"></label><label class="field">Night reminder<input type="time" id="nightTime"></label></div><div id="notifyStatus" class="notify-status">Checking notification permission…</div><button class="primary-btn" id="notifyBtn">🔔 Test notification</button><button class="secondary-btn" id="themeBtn">🌙 Dark mode: OFF</button><button class="secondary-btn" id="installBtn">📲 Install app</button><button class="secondary-btn danger-btn" id="resetBtn">Reset progress & photos</button><p class="note">Test notifications use the Android service worker. Exact-time reminders while the app is fully closed need Web Push/server support; this version also checks for missed reminders when you reopen the app.</p></div></div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><script src="app.js?v=9"></script></body></html>
